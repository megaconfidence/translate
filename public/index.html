<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#f6f7f9" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<title>Translate</title>
		<!-- Same asset as the in-app brand mark, so the two cannot drift apart. -->
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
		<!-- iOS ignores SVG here and wants an opaque PNG. -->
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="apple-mobile-web-app-title" content="Translate" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body data-state="boot">
		<!-- Live camera. Sits at the back; everything else floats over it. -->
		<video id="video" class="layer video" playsinline muted autoplay></video>

		<!-- Viewfinder framing guides. -->
		<div id="reticle" class="reticle" aria-hidden="true">
			<span class="corner tl"></span><span class="corner tr"></span>
			<span class="corner bl"></span><span class="corner br"></span>
			<p class="reticle-hint">Point at a menu or sign</p>
		</div>

		<!-- Captured still + translation overlay. -->
		<div id="viewer" class="layer viewer">
			<!-- Blurred copy of the photo, so the page never shows dead grey. -->
			<div id="ambient" class="ambient" aria-hidden="true"></div>
			<div id="frame" class="frame">
				<img id="photo" alt="Captured photo" />
				<div id="overlay" class="overlay"></div>
				<div id="scanner" class="scanner" hidden></div>
			</div>
		</div>

		<!-- Asks before the browser does, so the native prompt has context. -->
		<div id="primer" class="layer primer">
			<div class="dropcard">
				<div class="dropicon" aria-hidden="true">
					<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
						<path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.2-2h6.2l1.2 2h1.7A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5Z" />
						<circle cx="12" cy="12.5" r="3.4" />
					</svg>
				</div>
				<h2>Use your camera</h2>
				<p>Point it at a menu or sign. Nothing is sent until you tap the shutter.</p>
				<div class="droprow">
					<button id="allow-camera" class="btn btn-primary">Allow camera</button>
					<button id="primer-pick" class="btn btn-quiet">Choose image instead</button>
				</div>
			</div>
		</div>

		<!-- Upload-first fallback: no camera, or permission refused. -->
		<div id="dropzone" class="layer dropzone">
			<div class="dropcard">
				<div class="dropicon" aria-hidden="true">
					<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
						<path d="M3 16.5V19a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2.5" />
						<path d="M12 3v13" /><path d="m7.5 7.5 4.5-4.5 4.5 4.5" />
					</svg>
				</div>
				<h2>Translate a photo</h2>
				<p id="dropnote">Drop an image here, or choose one to get started.</p>
				<div class="droprow">
					<button id="choose" class="btn btn-primary">Choose image</button>
					<button id="enable-camera" class="btn btn-quiet">Use camera</button>
				</div>
			</div>
		</div>

		<!-- Top bar: language pill. -->
		<header class="topbar">
			<div class="brand">
				<img class="brand-mark" src="/icon.svg" alt="" width="25" height="25" />
				<span class="brand-name">Translate</span>
			</div>
			<label class="pill" id="langpill">
				<span class="pill-caption">to</span>
				<select id="target" aria-label="Target language"></select>
				<svg class="pill-chevron" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
			</label>
		</header>

		<!-- Status toast. -->
		<div id="toast" class="toast" role="status" hidden></div>

		<!-- Camera controls. -->
		<div id="camerabar" class="dock camerabar">
			<button id="pick" class="round round-ghost" aria-label="Choose image from library">
				<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5" /><circle cx="8.5" cy="8.5" r="1.6" /><path d="m21 15-4.5-4.5L7 21" /></svg>
			</button>
			<button id="shutter" class="shutter" aria-label="Capture and translate"><span></span></button>
			<button id="flip" class="round round-ghost" aria-label="Switch camera">
				<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a9 9 0 0 0-15.5-3L3 7.5" /><path d="M3 4v3.5h3.5" /><path d="M3 16a9 9 0 0 0 15.5 3L21 16.5" /><path d="M21 20v-3.5h-3.5" /></svg>
			</button>
		</div>

		<!-- Result sheet. -->
		<div id="sheet" class="dock sheet">
			<div class="sheet-grip" aria-hidden="true"></div>
			<div class="sheet-head">
				<div>
					<p class="sheet-title" id="sheet-title">Translated</p>
					<p class="sheet-sub" id="sheet-sub"></p>
				</div>
				<button id="retake" class="btn btn-primary btn-sm">New photo</button>
			</div>
			<div class="sheet-actions">
				<button id="toggle" class="chip" aria-pressed="true">
					<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="2.6" /></svg>
					<span id="toggle-label">Hold to compare</span>
				</button>
				<button id="download" class="chip">
					<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12" /><path d="m7.5 10.5 4.5 4.5 4.5-4.5" /><path d="M4 20h16" /></svg>
					<span>Save</span>
				</button>
			</div>
		</div>

		<!-- Tapped-region original text. -->
		<div id="peek" class="peek" hidden>
			<div class="peek-row">
				<span class="peek-tag" id="peek-tag">translation</span>
				<button id="peek-close" class="peek-close" aria-label="Dismiss">
					<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
				</button>
			</div>
			<p id="peek-translation"></p>
			<p class="peek-source"><span class="peek-tag">original</span><span id="peek-text"></span></p>
		</div>

		<!--
			Install prompt. Shown at a natural seam (tapping "New photo" after a
			successful translation), never mid-read. Two variants: Chromium gets a
			real install button, iOS gets Add-to-Home-Screen instructions because
			Safari has no beforeinstallprompt.
		-->
		<div id="install" class="install" hidden>
			<img class="install-icon" src="/icon.svg" alt="" width="40" height="40" />
			<div class="install-copy">
				<p class="install-title">Open straight to the camera</p>
				<p class="install-sub" id="install-sub">Add Translate to your home screen.</p>
			</div>
			<div class="install-actions">
				<button id="install-go" class="btn btn-primary btn-sm">Install</button>
				<button id="install-no" class="install-close" aria-label="Not now">
					<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
				</button>
			</div>
		</div>

		<input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden />

		<script src="/js/main.js" type="module"></script>
	</body>
</html>
